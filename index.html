<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Помощник нефтяник РФ</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-zinc-800">

    <header class="w-full border-b border-zinc-800/60 py-4 px-6 flex items-center justify-between bg-zinc-900/40 backdrop-blur-md sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-300">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M2 20h20v2H2v-2zm3-3l3-6 2 1-2.5 5H5zm7-9l3-4 2 1.5-3.5 3.5H12zm1.85 4.85l3.15-3.15L19 11l-4.15 4.15-1-1.3zM4 11h3v2H4v-2z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-sm font-medium tracking-tight text-zinc-200">Помощник нефтяник РФ</h1>
                <p class="text-xs text-zinc-500">База учебных материалов</p>
            </div>
        </div>
        <div id="nav-actions" class="text-xs text-zinc-400"></div>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto p-6 flex flex-col justify-center">
        <div id="app-view"></div>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-zinc-300 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Support Modal -->
    <div id="support-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 relative shadow-2xl flex flex-col h-[480px]">
            <div class="flex items-center justify-between pb-4 border-b border-zinc-800">
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h3 class="text-sm font-medium text-zinc-200">Служба поддержки</h3>
                </div>
                <button onclick="closeSupportModal()" class="text-zinc-500 hover:text-zinc-300 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto py-4 space-y-3 text-xs pr-1">
                <div class="bg-zinc-800/60 p-3 rounded-xl text-zinc-300 max-w-[85%]">
                    Здравствуйте! Напишите ваш вопрос или опишите проблему. Администратор ответит в ближайшее время.
                </div>
            </div>
            <form id="chat-form" onsubmit="sendSupportMessage(event)" class="pt-3 border-t border-zinc-800 flex gap-2">
                <input type="text" id="chat-input" placeholder="Введите ваше сообщение..." required
                    class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-700 transition">
                <button type="submit" class="bg-zinc-100 hover:bg-white text-zinc-950 font-medium px-4 py-2.5 rounded-xl text-xs transition">Отправить</button>
            </form>
        </div>
    </div>

    <footer class="w-full border-t border-zinc-900/60 py-4 text-center flex flex-col gap-1">
        <div class="text-xs text-zinc-600">&copy; 2026 Помощник нефтяник РФ. Все права защищены.</div>
        <div class="text-[11px] text-zinc-600 font-light">Создано выпускниками РФ</div>
    </footer>

    <script>
        const BACKEND_URL = window.location.origin;

        // Состояние навигации
        let state = { view: 'courses', course: null, semester: null, subject: null };

        // Каталог загружается один раз
        let catalog = {};

        // Структура для навигации, строится из каталога
        let tree = {}; // { course: { semester: { subject: [ {fileId, item} ] } } }

        const appView = document.getElementById('app-view');
        const navActions = document.getElementById('nav-actions');

        function getChatId() {
            const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
            if (tg?.id) return String(tg.id);
            return null;
        }

        // Строим дерево навигации из плоского каталога
        function buildTree(cat) {
            const t = {};
            for (const [fileId, item] of Object.entries(cat)) {
                const { course, semester, subject } = item;
                if (!t[course]) t[course] = {};
                if (!t[course][semester]) t[course][semester] = {};
                if (!t[course][semester][subject]) t[course][semester][subject] = [];
                t[course][semester][subject].push({ fileId, item });
            }
            return t;
        }

        async function init() {
            appView.innerHTML = '<div class="text-center text-zinc-500 text-sm py-12">Загрузка...</div>';
            try {
                const res = await fetch(`${BACKEND_URL}/api/catalog`);
                catalog = await res.json();
                tree = buildTree(catalog);
                render();
            } catch (e) {
                appView.innerHTML = '<div class="text-center text-zinc-500 text-sm py-12">Ошибка загрузки каталога</div>';
            }
        }

        function render() {
            appView.innerHTML = '';
            navActions.innerHTML = '';
            if (state.view === 'courses')   renderCourses();
            if (state.view === 'semesters') renderSemesters();
            if (state.view === 'subjects')  renderSubjects();
            if (state.view === 'files')     renderFiles();
        }

        function renderCourses() {
            const courses = Object.keys(tree).sort();
            let html = `
                <div class="mb-6 flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-semibold tracking-tight text-zinc-100">Выберите курс</h2>
                        <p class="text-xs text-zinc-500 mt-1">Доступны материалы с 1 по 6 курс обучения</p>
                    </div>
                    <button onclick="openSupportModal()" class="py-2 px-3.5 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-800 text-xs font-medium text-zinc-200 transition flex items-center gap-1.5 shadow-sm">
                        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                        Поддержка
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">`;
            courses.forEach(c => {
                html += `
                    <button onclick="selectCourse('${esc(c)}')" class="p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 hover:bg-zinc-900 transition flex flex-col items-start text-left group">
                        <span class="text-xs text-zinc-500 group-hover:text-zinc-400">Уровень</span>
                        <span class="text-base font-medium text-zinc-200 mt-1">${c}</span>
                    </button>`;
            });
            html += '</div>';
            appView.innerHTML = html;
        }

        function renderSemesters() {
            navActions.innerHTML = `<button onclick="goBack()" class="text-xs text-zinc-400 hover:text-zinc-200 transition">← Назад</button>`;
            const semesters = Object.keys(tree[state.course]).sort();
            let html = `
                <div class="mb-6">
                    <h2 class="text-xl font-semibold tracking-tight text-zinc-100">${state.course}</h2>
                    <p class="text-xs text-zinc-500 mt-1">Выберите семестр обучения</p>
                </div>
                <div class="space-y-2">`;
            semesters.forEach(s => {
                html += `
                    <button onclick="selectSemester('${esc(s)}')" class="w-full p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 hover:bg-zinc-900 transition flex items-center justify-between text-left">
                        <span class="text-sm font-medium text-zinc-200">${s}</span>
                        <span class="text-zinc-600">→</span>
                    </button>`;
            });
            html += '</div>';
            appView.innerHTML = html;
        }

        function renderSubjects() {
            navActions.innerHTML = `<button onclick="goBack()" class="text-xs text-zinc-400 hover:text-zinc-200 transition">← Назад</button>`;
            const subjects = Object.keys(tree[state.course][state.semester]).sort();
            let html = `
                <div class="mb-6">
                    <h2 class="text-xl font-semibold tracking-tight text-zinc-100">${state.semester}</h2>
                    <p class="text-xs text-zinc-500 mt-1">Выберите учебный предмет</p>
                </div>
                <div class="space-y-2">`;
            subjects.forEach(sub => {
                const count = tree[state.course][state.semester][sub].length;
                html += `
                    <button onclick="selectSubject('${esc(sub)}')" class="w-full p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 hover:bg-zinc-900 transition flex items-center justify-between text-left">
                        <span class="text-sm font-medium text-zinc-200">${sub}</span>
                        <span class="text-xs text-zinc-500">${count} файл(ов)</span>
                    </button>`;
            });
            html += '</div>';
            appView.innerHTML = html;
        }

        function renderFiles() {
            navActions.innerHTML = `<button onclick="goBack()" class="text-xs text-zinc-400 hover:text-zinc-200 transition">← Назад</button>`;
            const entries = tree[state.course][state.semester][state.subject];

            // Группируем по имени файла (одно задание = несколько вариантов)
            const groups = {};
            entries.forEach(({ fileId, item }) => {
                if (!groups[item.name]) groups[item.name] = { name: item.name, desc: item.desc, variants: [] };
                groups[item.name].variants.push({ fileId, item });
            });

            let html = `
                <div class="mb-6">
                    <h2 class="text-xl font-semibold tracking-tight text-zinc-100">${state.subject}</h2>
                    <p class="text-xs text-zinc-500 mt-1">Доступные материалы для скачивания</p>
                </div>
                <div class="space-y-2">`;

            Object.values(groups).forEach(group => {
                const hasPaid = group.variants.some(v => v.item.type === 'paid');
                const minPrice = hasPaid ? Math.min(...group.variants.filter(v => v.item.type === 'paid').map(v => v.item.price)) : 0;
                const badge = hasPaid
                    ? `<span class="text-[10px] uppercase font-semibold tracking-wider px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">от ${minPrice} ₽</span>`
                    : `<span class="text-[10px] uppercase font-semibold tracking-wider px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">Бесплатно</span>`;

                html += `
                    <div onclick='openFileModal(${JSON.stringify(group)})' class="w-full p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 hover:bg-zinc-900 transition flex items-center justify-between text-left cursor-pointer">
                        <div>
                            <div class="text-sm font-medium text-zinc-200">${group.name}</div>
                            <div class="text-xs text-zinc-500 mt-0.5">${group.variants.length} вариант(ов)</div>
                        </div>
                        <div>${badge}</div>
                    </div>`;
            });
            html += '</div>';
            appView.innerHTML = html;
        }

        function selectCourse(c)   { state.course = c; state.view = 'semesters'; render(); }
        function selectSemester(s) { state.semester = s; state.view = 'subjects'; render(); }
        function selectSubject(s)  { state.subject = s; state.view = 'files'; render(); }

        function goBack() {
            if (state.view === 'semesters') { state.view = 'courses'; }
            else if (state.view === 'subjects') { state.view = 'semesters'; }
            else if (state.view === 'files') { state.view = 'subjects'; }
            render();
        }

        function openFileModal(group) {
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="mb-4">
                    <span class="text-xs text-zinc-500 uppercase tracking-wider">${state.subject}</span>
                    <h3 class="text-lg font-medium text-zinc-100 mt-1">${group.name}</h3>
                </div>
                <p class="text-xs text-zinc-400 mb-5">${group.desc || ''}</p>
                <div class="space-y-2" id="modal-actions-container">
                    <button onclick='showVariants(${JSON.stringify(group)})' class="w-full py-2.5 px-4 rounded-xl bg-zinc-100 hover:bg-white text-zinc-950 font-medium text-xs transition">Выбрать вариант</button>
                </div>`;
            document.getElementById('modal').classList.replace('hidden', 'flex');
        }

        function showVariants(group) {
            const container = document.getElementById('modal-actions-container');
            let html = `<div class="text-xs font-medium text-zinc-300 mb-2">Выберите вариант:</div><div class="space-y-2 max-h-48 overflow-y-auto pr-1">`;
            group.variants.forEach(({ fileId, item }) => {
                const actionText = item.type === 'free' ? 'Скачать бесплатно' : `Оплатить и скачать (${item.price} ₽)`;
                html += `
                    <div class="flex items-center justify-between p-2.5 rounded-lg bg-zinc-950/50 border border-zinc-800/65">
                        <span class="text-xs text-zinc-200 font-medium">${item.variant}</span>
                        <button onclick='handleAction("${fileId}", "${item.type}")' class="py-1.5 px-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-[11px] transition">${actionText}</button>
                    </div>`;
            });
            html += `</div><button onclick='openFileModal(${JSON.stringify(group)})' class="w-full mt-3 py-2 px-4 rounded-xl bg-zinc-950 text-zinc-400 hover:text-zinc-200 text-xs transition">← Назад</button>`;
            container.innerHTML = html;
        }

        async function handleAction(fileId, type) {
            const chatId = getChatId();
            if (!chatId) {
                showToast('Откройте приложение через Telegram');
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/create-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileId, chatId })
                });
                const data = await res.json();

                if (data.freeUrl) {
                    window.open(data.freeUrl, '_blank');
                    closeModal();
                    return;
                }
                if (data.paymentUrl) {
                    window.location.href = data.paymentUrl;
                    return;
                }
                throw new Error(data.error || 'Неизвестная ошибка');
            } catch (e) {
                showToast('Ошибка: ' + e.message);
            }
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs px-4 py-2 rounded-xl shadow-lg z-[100]';
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function closeModal() {
            document.getElementById('modal').classList.replace('flex', 'hidden');
        }
        function openSupportModal() {
            document.getElementById('support-modal').classList.replace('hidden', 'flex');
        }
        function closeSupportModal() {
            document.getElementById('support-modal').classList.replace('flex', 'hidden');
        }

        function sendSupportMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msgs = document.getElementById('chat-messages');
            const text = input.value.trim();
            if (!text) return;
            const d = document.createElement('div');
            d.className = 'bg-zinc-800 text-zinc-100 p-3 rounded-xl max-w-[85%] ml-auto text-right text-xs';
            d.textContent = text;
            msgs.appendChild(d);
            input.value = '';
            msgs.scrollTop = msgs.scrollHeight;
            setTimeout(() => {
                const r = document.createElement('div');
                r.className = 'bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-zinc-300 max-w-[85%] text-xs';
                r.textContent = 'Сообщение отправлено! Мы свяжемся с вами в течение 10-15 минут.';
                msgs.appendChild(r);
                msgs.scrollTop = msgs.scrollHeight;
            }, 1000);
        }

        // Экранирование для onclick-атрибутов
        function esc(s) { return s.replace(/'/g, "\\'"); }

        init();
    </script>
</body>
</html>
